[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmcforge"
version = "0.1.0"
description = "Scaffold for designing, running and evaluating Human-Machine Collaboration frameworks driven by dynamic power handover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HMCForge contributors" }]
keywords = ["human-machine-collaboration", "handover", "frameworks", "evaluation", "seci", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/hmcforge/hmcforge"
Documentation = "https://github.com/hmcforge/hmcforge/blob/main/docs/index.md"
Repository = "https://github.com/hmcforge/hmcforge"

[project.scripts]
hmcforge-demo = "hmcforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
